# This file denotes the base configuration for the OKD 4.x cluster deployment.
# Docs: https://github.com/openshift/installer/blob/main/docs/user/customization.md
apiVersion: v1
baseDomain: onemarc.io
compute:
  - hyperthreading: Enabled
    name: worker
    replicas: 9
controlPlane:
  hyperthreading: Enabled
  name: master
  replicas: 3
metadata:
  name: okd-lab
capabilities:
  baselineCapabilitySet: None
  additionalEnabledCapabilities:
    - baremetal
    - CSISnapshot
    - Console
    - Ingress
networking:
  machineNetwork:
    - cidr: 192.168.8.0/24 # Must match your physical network
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  serviceNetwork:
    - 172.30.0.0/16
  networkType: OVNKubernetes # or OpenShiftSDN
platform:
  none: {}
  # baremetal:
  #   apiVIPs: ["192.168.8.33"]  # Must be unused IP in your network | if defined == masters and workers look for that ip
  #   ingressVIPs: ["192.168.8.34"]  # Another unused IP
